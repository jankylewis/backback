name: Release draft
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .target
          key: cargo-${{ runner.os }}-${{ hashFiles('bb_crates/Cargo.lock') }}
      - name: Match tag to Cargo version
        run: |
          version="$(cd bb_crates && cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "bb"))')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build ad-hoc signed app
        run: bash docs/release/scripts/bb_bundle.sh
      - name: Verify bundle and archive
        run: |
          codesign --verify --deep --strict .target/bundle/backback.app
          ditto -c -k --keepParent .target/bundle/backback.app .target/bundle/backback.app.zip
          unzip -t .target/bundle/backback.app.zip
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .target/bundle/backback.app.zip --draft --title "backback $GITHUB_REF_NAME"
