name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .target
          key: cargo-${{ runner.os }}-${{ hashFiles('bb_crates/Cargo.lock') }}
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Format
        run: cargo fmt --check
        working-directory: bb_crates
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: bb_crates
      - name: Tests
        run: cargo test --workspace
        working-directory: bb_crates
      - name: Dependency audit
        run: cargo deny check
        working-directory: bb_crates
      - name: Backback audit
        run: cargo run -p bb -- audit ..
        working-directory: bb_crates
