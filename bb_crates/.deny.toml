# cargo deny: licences, advisories, duplicate crates. Part of the one-command gate.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI's single Zed revision brings these three pinned transitive sources.
allow-git = [
  "https://github.com/zed-industries/zed",
  "https://github.com/zed-industries/font-kit",
  "https://github.com/zed-industries/oo7",
  "https://github.com/gfx-rs/wgpu",
]
