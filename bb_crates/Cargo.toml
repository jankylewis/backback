[workspace]
resolver = "2"
members = [
  "bb_core/bb_text",
  "bb_core/syntax",
  "bb_core/explorer",
  "edge/bb_lsp",
  "edge/framing",
  "edge/dap",
  "edge/dotnet",
  "edge/mcp",
  "shell/bb_cli",
  "shell/ui",
  "shell/desktop",
  "shell/audit",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jankylewis/backback"
description = "backback: a very lightweight, dark-by-default, open-source C# IDE shell"

[workspace.dependencies]
# internal crates (one place for paths; crates use `bb-x.workspace = true`).
# The version keeps cargo deny from reading a path dep as a wildcard; keep it
# equal to workspace.package.version.
bb-text = { path = "bb_core/bb_text", version = "0.0.1" }
bb-syntax = { path = "bb_core/syntax", version = "0.0.1" }
bb-explorer = { path = "bb_core/explorer", version = "0.0.1" }
bb-lsp = { path = "edge/bb_lsp", version = "0.0.1" }
bb-framing = { path = "edge/framing", version = "0.0.1" }
bb-dap = { path = "edge/dap", version = "0.0.1" }
bb-dotnet = { path = "edge/dotnet", version = "0.0.1" }
bb-mcp = { path = "edge/mcp", version = "0.0.1" }
bb-ui = { path = "shell/ui", version = "0.0.1" }
# One Zed revision for the macOS desktop shell.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", default-features = false }
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d", default-features = false, features = ["font-kit", "runtime_shaders"] }
bb-audit = { path = "shell/audit", version = "0.0.1" }
# text
ropey = "1.6"
# syntax
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
# protocols
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.95 still uses url::Url; 0.96+ switched to its own Uri type (migrate deliberately, with tests)
lsp-types = "0.95"
url = "2"
# async + processes (every call carries a timeout; see crates/protocol)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
# errors
thiserror = "2"
# .slnx is XML
roxmltree = "0.20"
# dev
proptest = "1"

# One lint set for every crate. unwrap/expect/panic are allowed only under #[cfg(test)].
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
wildcard_enum_match_arm = "deny"
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
